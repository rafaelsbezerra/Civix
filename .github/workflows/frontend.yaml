name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

  pull_request:
    branches:
      - main
      - staging
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Trigger Vercel Staging Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: curl --fail --silent --show-error --request POST "${{ secrets.STG_FRONTEND_DEPLOY_HOOK }}"

      - name: Trigger Vercel Production Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --silent --show-error --request POST "${{ secrets.FRONTEND_DEPLOY_HOOK }}"
