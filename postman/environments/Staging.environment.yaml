name: 'Civix Staging'
values:
  - key: baseUrl
    value: 'https://staging.example.invalid'
    enabled: true
    type: default
    description: 'Origem do backend, sem barra final.'
  - key: confirmedWriteBaseUrl
    value: ''
    enabled: true
    type: default
    description: 'Repita exatamente baseUrl para confirmar mutações neste ambiente.'
  - key: accessToken
    value: ''
    enabled: true
    type: secret
    description: 'JWT opcional. O fluxo padrão usa o cookie sessao.'
  - key: allowWrites
    value: 'false'
    enabled: true
    type: default
    description: 'Defina true para permitir operações que criam ou alteram dados.'
  - key: allowDestructive
    value: 'false'
    enabled: true
    type: default
    description: 'Defina true, junto de allowWrites, para suspender, arquivar ou excluir.'
  - key: allowAdministrativeWrites
    value: 'false'
    enabled: true
    type: default
    description: 'Permite alterações administrativas depois da confirmação do ambiente.'
  - key: allowEmails
    value: 'false'
    enabled: true
    type: default
    description: 'Permite fluxos que podem enviar e-mails.'
  - key: allowIdentityWrites
    value: 'false'
    enabled: true
    type: default
    description: 'Permite redefinição e definição de senha.'
  - key: allowStorage
    value: 'false'
    enabled: true
    type: default
    description: 'Permite gravar arquivos no storage configurado.'
  - key: allowProfileUpdate
    value: 'false'
    enabled: true
    type: default
    description: 'Permite alterar o próprio perfil e invalidar a sessão.'
  - key: allowRoleSwitch
    value: 'false'
    enabled: true
    type: default
    description: 'Permite substituir a sessão ativa por outro papel.'
